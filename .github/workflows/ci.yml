name: CI
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Node 24 to match the dev machine, and specifically to get npm 11. npm writes one of
      # vitest's nested esbuild platform binaries into the lockfile without `optional: true`;
      # npm 10 then treats an AIX-only binary as a hard requirement and `npm ci` dies with
      # EBADPLATFORM on linux. A lockfile is only a guarantee against the npm that wrote it.
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test

      # The same suite again in a negative-offset zone, in the same job — a suite nobody
      # runs is worth nothing. Neither zone is sufficient alone. London has two DST
      # transitions a year, which is what makes schedule.test.ts test something; São Paulo
      # has had none since 2019 but is UTC−3, which is the only way to see a calendar
      # all-day event decoded with local getters instead of UTC ones.
      - run: npm run test:tz

      # Catches a schema change committed without regenerating the migrations. The app
      # applies the generated bundle, never src/db/schema.ts, so drift here means the
      # running app queries tables that were never created — and every other gate passes.
      - name: Migrations match the schema
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts changed without running 'npm run db:generate'."
            git status --porcelain drizzle
            git diff -- drizzle
            exit 1
          fi

      # Not redundant with the checks above. Imports that only Metro resolves — notably the
      # .sql migrations, which need both metro.config.js and babel.config.js — pass
      # typecheck, lint and tests and still fail to bundle.
      - run: npm run build
